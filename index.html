<script>window.__SERVER="https://script.google.com/macros/s/AKfycbyQKy2qGkcAwLcu6C6EElL_LKeYA75oW4Rwg-IBxkksT4d-KjWFxQn5f3sXtG1q30ljrA/exec";</script>
<script>
(function(){
const D=86400000;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)};
const fd=t=>new Date(t).toISOString().slice(0,10);
const add=(s,n)=>fd(pd(s)+n*D);
const dowi=s=>(new Date(pd(s)).getUTCDay()+6)%7;
const monday=s=>add(s,-dowi(s));
const DN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'], DNL=['Lunes','Martes','Miercoles','Jueves','Viernes','Sabado','Domingo'];
const MN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dl=s=>{const d=new Date(pd(s));return d.getUTCDate()+' '+MN[d.getUTCMonth()]};
const SLOTS=['M','T','N'];
const AUS_TYPES=['Vacaciones','Permiso','Curso ascenso','Comisión','Incapacidad','Semana Santa','Navideño','Cumpleaños','Excusa','Otro'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- estado ---------- */
const DEF={
 cfg:{start:'2026-10-26',weeks:8,anchor:'2026-10-26',anchorTeam:'A',umbral:3,sesic:1,lab:{M:'5hrs - 17hrs',T:'11hrs - 23hrs',N:'2y3'},short:{M:'5–17',T:'11–23',N:'2y3'}},
 people:[
  {id:'ort',name:'Ortiz',rank:'IJ.',team:'B',tipo:'fijo',fijoCode:'N',fijoFinde:false,can:{M:true,T:true,N:true}},
  {id:'esc',name:'Escobar',rank:'IJ.',team:'A',tipo:'rota',can:{M:true,T:true,N:true}},
  {id:'pin',name:'Pino',rank:'IJ.',team:'A',tipo:'rota',can:{M:true,T:true,N:true}},
  {id:'gut',name:'Gutierrez',rank:'SI.',team:'B',tipo:'rota',can:{M:true,T:true,N:true}},
  {id:'pri',name:'Prieto',rank:'SI.',team:'B',tipo:'rota',can:{M:true,T:true,N:true}},
  {id:'cla',name:'Claudia',rank:'SI.',team:'B',tipo:'rota',can:{M:true,T:true,N:true}},
  {id:'oso',name:'Osorio',rank:'PT.',team:'A',tipo:'rota',can:{M:true,T:true,N:true}}],
 abs:[
  {id:'a1',pid:'pin',type:'Vacaciones',from:'2026-10-26',to:'2026-11-04'},
  {id:'a2',pid:'pri',type:'Curso ascenso',from:'2026-10-26',to:'2026-11-08'},
  {id:'a3',pid:'ort',type:'Curso ascenso',from:'2026-10-26',to:'2026-11-08'},
  {id:'a4',pid:'oso',type:'Permiso',from:'2026-10-26',to:'2026-10-26'}],
 ov:{}
};
DEF.avisos=[];
const SERVER=window.__SERVER||null;
let st;const KEY='turnosBalistica1';
try{st=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(SERVER||!st||!st.cfg)st=JSON.parse(JSON.stringify(DEF));
st.avisos=st.avisos||[];
let role=SERVER?null:'admin',CRED=null,GK=null,ver=0,dirty=false,pubSnap=null,seg=null,loginErr='',loginMode='ver',busy=false,listo=true,newer=false;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const save=()=>{if(SERVER){dirty=true;return}lsSet(KEY,JSON.stringify(st))};
const todayISO=()=>new Date().toLocaleDateString('en-CA');
const avTo=new Set();
let tab='prog',wi=0,edit=null,toastT=null,showAll={},yo=lsGet('tb_yo')||'',pubDlg=null;
function srv(q){return fetch(SERVER,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(q)}).then(r=>r.json())}
const P=id=>st.people.find(p=>p.id===id);
const pn=p=>p.rank+' '+p.name;
const lab=c=>st.cfg.lab[c], sh=c=>st.cfg.short[c];

/* ---------- motor ---------- */
const effW=()=>{const c=st.cfg,s0=monday(c.start);return Math.max(c.weeks,Math.min(104,Math.ceil((pd(new Date().toLocaleDateString('en-CA'))-pd(s0))/(7*D))+c.weeks))};
function* perms(a,k=0){if(k>=a.length-1){yield a.slice();return}for(let i=k;i<a.length;i++){[a[k],a[i]]=[a[i],a[k]];yield* perms(a,k+1);[a[k],a[i]]=[a[i],a[k]]}}
function build(){
 const cfg=st.cfg,start=monday(cfg.start),days=[];
 const prev={},cnt={},sc={},ls={};
 st.people.forEach(p=>{prev[p.id]=null;cnt[p.id]={M:0,T:0,N:0};sc[p.id]=0;ls[p.id]=-1});
 const am={};st.abs.forEach(a=>{for(let t=pd(a.from);t<=pd(a.to);t+=D)am[a.pid+'|'+fd(t)]=a.type});
 const nx={M:'T',T:'N',N:'M'};let gi=0;
 for(let w=0,W=effW();w<W;w++){
  const m=add(start,w*7),wk=Math.round((pd(m)-pd(monday(cfg.anchor)))/(7*D));
  const other=cfg.anchorTeam==='A'?'B':'A',wkTeam=((wk%2)+2)%2===0?cfg.anchorTeam:other;
  const wa={};st.people.forEach(p=>{let c=0;for(let i=0;i<7;i++)if(am[p.id+'|'+add(m,i)])c++;wa[p.id]=c});
  for(let i=0;i<7;i++,gi++){
   const date=add(m,i),we=i>=5,as={};
   const isA=p=>am[p.id+'|'+date];
   const inPool=p=>!(isA(p)&&wa[p.id]>=cfg.umbral);
   const fixCov={M:0,T:0,N:0};
   st.people.filter(p=>p.tipo==='fijo').forEach(p=>{
     if(we&&!p.fijoFinde)as[p.id]={plan:'FINDE'};else{as[p.id]={plan:p.fijoCode};if(!(isA(p)&&wa[p.id]>=cfg.umbral))fixCov[p.fijoCode]++}});
   const rota=st.people.filter(p=>p.tipo==='rota');
   let pool,req=SLOTS.filter(s=>we||!fixCov[s]);
   if(we){pool=rota.filter(p=>p.team===wkTeam&&inPool(p));rota.filter(p=>p.team!==wkTeam).forEach(p=>as[p.id]={plan:'FINDE'})}
   else pool=rota.filter(inPool);
   let sn=0;
   if(!we){sn=Math.min(cfg.sesic,Math.max(0,pool.length-req.length));
     const c=pool.slice().sort((a,b)=>sc[a.id]-sc[b.id]||ls[a.id]-ls[b.id]||a.id.localeCompare(b.id));
     c.slice(0,sn).forEach(p=>{as[p.id]={plan:'SESIC'};sc[p.id]++;ls[p.id]=gi});}
   const wk2=pool.filter(p=>!as[p.id]);
   const base=['N','M','T'].filter(s=>req.includes(s));
   const seats=wk2.length<=base.length?base.slice(0,wk2.length):base.concat(Array.from({length:wk2.length-base.length},(_,k)=>['N','M','T'][k%3]));
   const cost=(p,s)=>{const pv=prev[p.id];let c=pv==null?0:(s===nx[pv]?0:s===pv?1.2:2);c+=cnt[p.id][s]*0.3;if(!p.can[s])c+=100;return c};
   let best=null,bc=1e9;
   if(wk2.length){for(const pr of perms(seats.slice())){let c=0;for(let k=0;k<wk2.length;k++)c+=cost(wk2[k],pr[k]);if(c<bc){bc=c;best=pr.slice()}}
     wk2.forEach((p,k)=>{as[p.id]={plan:best[k]};prev[p.id]=best[k];cnt[p.id][best[k]]++})}
   st.people.forEach(p=>{
     if(!as[p.id])as[p.id]={plan:'SESIC'};
     const a=as[p.id];a.code=a.plan;
     if(isA(p)){a.code='AUS';a.aus=am[p.id+'|'+date]}
     else{const o=st.ov[date+'|'+p.id];if(o){a.code=o.code;a.ovr=true;a.para=o.para||null}}
   });
   days.push({date,i,we,wkTeam,as});
  }
 }
 days.forEach(d=>{d.cov={M:0,T:0,N:0};st.people.forEach(p=>{const c=d.as[p.id].code;if(d.cov[c]!==undefined)d.cov[c]++});
   d.gaps=SLOTS.filter(s=>d.cov[s]===0);
   d.lost={};d.gaps.forEach(s=>d.lost[s]=st.people.filter(p=>d.as[p.id].code==='AUS'&&d.as[p.id].plan===s).map(p=>p.id));});
 return days;
}
const snapN=()=>JSON.stringify({cfg:st.cfg,people:st.people,abs:st.abs,ov:st.ov});
function buildFor(o){const k=st;st=o;try{return build()}finally{st=k}}
function coverCount(pid){return Object.entries(st.ov).filter(([k,v])=>k.endsWith('|'+pid)&&v.cover).length}
function suggest(days,di,slot){
 const d=days[di],out=[];
 const lostIds=d.lost[slot]||[];
 st.people.forEach(p=>{
  const a=d.as[p.id];if(a.code==='AUS'||!p.can[slot])return;
  let base,why=[],kind;
  if(SLOTS.includes(a.code)){if(d.cov[a.code]<2)return;base=.5;kind='mover';why.push('Hoy hay 2 o más en '+sh(a.code)+': pasa a '+sh(slot)+' y ese turno sigue cubierto')}
  else if(a.code==='SESIC'){base=1;kind='sesic';why.push('Estaba en tareas SESIC ese día')}
  else if(a.code==='FINDE'){base=p.tipo==='fijo'?5:4;kind='descanso';why.push('Estaba en descanso: se le debe un franco compensatorio')}
  else return;
  let sc=base;
  const y=di>0?days[di-1].as[p.id].code:null,t=di<days.length-1?days[di+1].as[p.id].code:null;
  if(y==='N'&&slot==='M'){sc+=1.5;why.push('Venía de 2y3 la noche anterior y entra a madrugar')}
  if(t==='M'&&slot==='N'){sc+=1.5;why.push('Tendría 2y3 hoy y madruga mañana')}
  let run=0;for(let k=di-1;k>=0&&run<10;k--){if(['M','T','N','SESIC'].includes(days[k].as[p.id].code))run++;else break}
  if(run>=6){sc+=2;why.push('Lleva '+run+' días seguidos trabajando')}
  const cc=coverCount(p.id);if(cc){sc+=cc*.8;why.push('Ya cubrió '+cc+' vez'+(cc>1?'ces':'')+' en este periodo')}
  if(lostIds.some(id=>P(id).team===p.team)){sc-=.3;why.push('Mismo equipo que quien se ausenta')}
  if(!why.length)why.push('Disponible');
  out.push({pid:p.id,score:Math.round(sc*10)/10,kind,why});
 });
 return out.sort((a,b)=>a.score-b.score);
}

function removeAbsDay(pid,date){
 const out=[];
 st.abs.forEach(a=>{if(a.pid!==pid||date<a.from||date>a.to){out.push(a);return}
  if(a.from<date)out.push({...a,id:a.id+'a',to:add(date,-1)});
  if(a.to>date)out.push({...a,id:a.id+'b',from:add(date,1)})});
 st.abs=out;
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.dataset.act==='close'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="close"]'))return;
 const x=el.dataset,a=x.act;
 if(NEWACT(x,a,e))return;
 if(a==='tab'){tab=x.k;render();return}
 if(a==='wk'){wi+=+x.n;render();return}
 if(a==='edit'){edit={pid:x.p,date:x.d};render();return}
 if(a==='close'){edit=null;render();return}
 if(a==='pubx'){pubDlg=null;render();return}
 if(a==='setcode'){const k=edit.date+'|'+edit.pid;st.ov[k]={code:x.c,cover:false};edit=null;rebuild();render();return}
 if(a==='clearcell'){delete st.ov[edit.date+'|'+edit.pid];edit=null;rebuild();render();return}
 if(a==='setaus'){const t=document.getElementById('m-t').value;st.abs.push({id:'a'+Date.now(),pid:edit.pid,type:t,from:edit.date,to:edit.date});delete st.ov[edit.date+'|'+edit.pid];edit=null;rebuild();render();toast('Ausencia registrada');return}
 if(a==='delausday'){removeAbsDay(edit.pid,edit.date);edit=null;rebuild();render();return}
 if(a==='addabs'){
  const pid=document.getElementById('f-p').value,t=document.getElementById('f-t').value,f=document.getElementById('f-a').value,u=document.getElementById('f-b').value||f;
  if(!f||u<f){toast('Elige las fechas (desde, hasta)');return}
  st.abs.push({id:'a'+Date.now(),pid,type:t,from:f,to:u});rebuild();render();
  const n=gapsAll().length;toast(n?n+' turno'+(n>1?'s':'')+' sin cubrir: mira las sugerencias':'Registrada; todo sigue cubierto');return}
 if(a==='delabs'){st.abs=st.abs.filter(z=>z.id!==x.id);rebuild();render();return}
 if(a==='more'){showAll[x.k]=!showAll[x.k];render();return}
 if(a==='cover'){applyCover(x.d,x.p,x.s,x.l);rebuild();render();toast(pn(P(x.p))+' cubre el '+sh(x.s)+' del '+dl(x.d));return}
 if(a==='autocover'){let n=0;const skip=new Set();for(let g=0;g<400;g++){const gs=gapsAll().filter(z=>!skip.has(z.di+z.s));if(!gs.length)break;const{di,s}=gs[0];const sg=suggest(days,di,s);if(!sg.length){skip.add(di+s);continue}
   applyCover(days[di].date,sg[0].pid,s,(days[di].lost[s]||[])[0]);days=build();n++}
  rebuild();render();toast(n+' cobertura'+(n!==1?'s':'')+' asignada'+(n!==1?'s':''));return}
 if(a==='clearov'){st.ov={};rebuild();render();return}
 if(a==='addp'){st.people.push({id:'p'+Date.now(),name:'Nuevo',rank:'SI.',team:'A',tipo:'rota',can:{M:true,T:true,N:true},fijoCode:'N',fijoFinde:false});rebuild();render();return}
 if(a==='delp'){const p=st.people[+x.i];st.people.splice(+x.i,1);st.abs=st.abs.filter(z=>z.pid!==p.id);rebuild();render();return}
 if(a==='reset'){st=JSON.parse(JSON.stringify(DEF));st.nbase=snapN();rebuild();goToday();render();toast('Datos de ejemplo restaurados');return}
});

function weekText(){

 wd.forEach(d=>{L.push('');L.push('*'+DNL[d.i]+' '+dl(d.date)+'*');
  SLOTS.forEach(s=>{const n=st.people.filter(p=>d.as[p.id].code===s).map(p=>p.rank+' '+p.name);L.push(sh(s)+': '+(n.join(', ')||'SIN CUBRIR'))});

async function admAction(q,okMsg){
 try{const r=await srv(Object.assign({usuario:CRED.u,pin:CRED.p},q));if(r.error){toast(errTxt(r.error));return false}
  const f=await srv({accion:'estado',usuario:CRED.u,pin:CRED.p});if(f.ok){const keep=dirty?stripSeg():null;const d0=dirty;adopt(f.estado,f.v);if(keep){st=Object.assign(keep,{seg:f.estado.seg});days=build();dirty=d0;}}
  render();toast(okMsg);return true}
 catch(e){toast('Sin conexión');return false}
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function NEWACT(x,a,e){
 if(a==='lm'){loginMode=x.m;loginErr='';render();return true}
 if(a==='login-ver'){loginVer(val('l-g'));return true}
 if(a==='login-adm'){loginAdm(val('l-u'),document.getElementById('l-p').value);return true}
 if(a==='login-ins'){instalarSrv(val('i-s'),val('i-u'),document.getElementById('i-p').value,val('i-g'));return true}
 if(a==='logout'){logout();return true}
 if(a==='copy'){copyText(weekText(),'Semana copiada');return true}
 if(a==='xlsx'){exportXlsx();return true}
 if(a==='pub'){doPublish();return true}
 if(a==='pcopy'){const pd_=pendientes();copyText(msgPersona(x.p,pd_.per[x.p]||[]),'Mensaje copiado');return true}
 if(a==='pcopyall'){const pd_=pendientes();copyText(Object.keys(pd_.per).map(id=>msgPersona(id,pd_.per[id])).join('\n\n'),'Mensajes copiados');return true}
 if(a==='pnotif'){const pd_=pendientes(),ids=Object.keys(pd_.per);if(!ids.length)return true;
   const tx='*Cambios en la programación de turnos*\n'+ids.map(id=>'• '+pn(P(id))+'\n'+pd_.per[id].slice(0,10).map(z=>'   '+z.l).join('\n')).join('\n');
   st.avisos.unshift({id:Date.now(),t:new Date().toISOString(),titulo:'Cambios en la programación',texto:tx,pids:ids,por:(seg&&seg.yo)||'Admin'});
   st.nbase=snapN();if(SERVER){dirty=true;doPublish({nota:'Notificó cambios de turnos a '+ids.length+' funcionario(s)'})}else{save();render();toast('Aviso publicado')}return true}
 if(a==='pmark'){st.nbase=snapN();save();render();toast('Marcado como notificado');return true}
 if(a==='avto'){if(avTo.has(x.p))avTo.delete(x.p);else avTo.add(x.p);const k=document.getElementById('av-t'),m=document.getElementById('av-x');const kv=k?k.value:'',mv=m?m.value:'';render();const k2=document.getElementById('av-t'),m2=document.getElementById('av-x');if(k2)k2.value=kv;if(m2)m2.value=mv;return true}
 if(a==='avall'){avTo.clear();const k=document.getElementById('av-t'),m=document.getElementById('av-x');const kv=k?k.value:'',mv=m?m.value:'';render();document.getElementById('av-t').value=kv;document.getElementById('av-x').value=mv;return true}
 if(a==='solve'){applyCover(x.d,x.p,x.s,x.l);rebuild();render();toast(pn(P(x.p))+' cubre el '+sh(x.s)+' del '+dl(x.d)+'. Queda por notificar en Avisos');return true}
 if(a==='avpub'){
   const ti=val('av-t')||'Aviso',tx=document.getElementById('av-x').value.trim();if(!tx){toast('Escribe el mensaje');return true}
   st.avisos.unshift({id:Date.now(),t:new Date().toISOString(),titulo:ti,texto:tx,pids:[...avTo],por:(seg&&seg.yo)||'Admin'});avTo.clear();
   if(SERVER){dirty=true;doPublish({nota:'Publicó el aviso “'+ti+'”'})}else{save();render();toast('Aviso publicado')}return true}
 if(a==='avwa'){const t=val('av-t'),x=document.getElementById('av-x').value.trim();if(!x){toast('Escribe el mensaje');return true}copyText((t?'*'+t+'*\n':'')+x,'Copiado para WhatsApp');return true}
 if(a==='avweek'){const ta=document.getElementById('av-x');ta.value=weekText();if(!val('av-t'))document.getElementById('av-t').value='Turnos de la semana';return true}
 if(a==='avcopy'){const v=st.avisos.find(z=>String(z.id)===x.id);if(v)copyText('*'+(v.titulo||'Aviso')+'*\n'+v.texto,'Copiado para WhatsApp');return true}
 if(a==='avdel'){st.avisos=st.avisos.filter(z=>String(z.id)!==x.id);save();render();return true}
 if(a==='gsave'){const g=val('g-new');if(g.length<4){toast('Mínimo 4 caracteres');return true}
   (async()=>{const est=stripSeg();const r=await srv({accion:'guardar',usuario:CRED.u,pin:CRED.p,v:ver,estado:est,grupoNuevo:g,nota:'Cambió la clave del grupo'});
     if(r.error){toast(errTxt(r.error));return}ver=r.v;await admAction({accion:'version'},'Clave del grupo cambiada')})();return true}
 if(a==='ginv'){copyText('Programación de turnos de balística\n'+location.href.split('#')[0]+'\nEntra con “Ver turnos” y esta clave: '+seg.grupo,'Invitación copiada');return true}
 if(a==='a2save'){admAction({accion:'crearAdmin',nuevoUsuario:val('a2-u'),nuevaPass:document.getElementById('a2-p').value},'Administrador guardado');return true}
 if(a==='a2del'){admAction({accion:'quitarAdmin'},'Administrador quitado');return true}
 if(a==='mypass'){const np=document.getElementById('my-p').value;(async()=>{const ok=await admAction({accion:'cambiarPass',nuevaPass:np},'Contraseña cambiada');if(ok)CRED.p=np})();return true}
 return false;
}
function boot(){
 if(!SERVER){if(!st.nbase)st.nbase=snapN();render();return}
 srv({accion:'info'}).then(r=>{listo=!!r.listo;const g=lsGet('tb_gk');if(g&&listo)loginVer(g,true);else render()}).catch(()=>{loginErr='No hay conexión con el servidor.';render()});
 render();
}
boot();
})();
</script>
</html>
